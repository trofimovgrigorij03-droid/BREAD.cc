name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Настройка 32-битного компилятора MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Сборка
        shell: pwsh
        run: |
          $b = Get-ChildItem -Recurse -Filter build.bat | Select-Object -First 1
          if (-not $b) { Write-Error "build.bat не найден в репозитории"; exit 1 }
          Set-Location $b.DirectoryName
          cmd /c "call build.bat"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "OUTDIR=$($b.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Сохранить exe
        uses: actions/upload-artifact@v4
        with:
          name: Hlebushek_Injector
          path: ${{ env.OUTDIR }}\bin\Hlebushek_Injector.exe
